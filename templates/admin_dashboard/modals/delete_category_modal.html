<!-- Delete Category Confirmation Modal -->
<div id="deleteCategoryModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-lg max-w-sm w-full overflow-hidden animate-in">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-gray-200 p-6">
      <h2 class="text-lg font-semibold text-gray-900">Delete Category</h2>
      <button onclick="closeDeleteCategoryModal()" class="text-gray-400 hover:text-gray-600">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <!-- Content -->
    <div class="p-6 space-y-4">
      <div class="flex items-start gap-3">
        <div class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-red-100">
          <span class="material-symbols-outlined text-red-600">warning</span>
        </div>
        <div>
          <h3 class="font-medium text-gray-900">Are you sure?</h3>
          <p class="text-sm text-gray-600 mt-1">
            This will permanently delete the category <strong id="deleteCategoryName"></strong> and all associated products. This action cannot be undone.
          </p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex gap-3 border-t border-gray-200 p-6">
      <button onclick="closeDeleteCategoryModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">
        Cancel
      </button>
      <button id="confirmDeleteCategoryBtn" onclick="confirmDeleteCategory()" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 transition-colors">
        Delete Category
      </button>
    </div>
  </div>
</div>

<script>
  let deleteCategoryData = null;

  function openDeleteCategoryModal(categoryId, categoryName) {
    deleteCategoryData = { categoryId, categoryName };
    document.getElementById('deleteCategoryName').textContent = categoryName;
    document.getElementById('deleteCategoryModal').classList.remove('hidden');
  }

  function closeDeleteCategoryModal() {
    document.getElementById('deleteCategoryModal').classList.add('hidden');
    deleteCategoryData = null;
  }

  function confirmDeleteCategory() {
    if (!deleteCategoryData) return;
    
    const { categoryId } = deleteCategoryData;
    const btn = document.getElementById('confirmDeleteCategoryBtn');
    btn.disabled = true;
    btn.textContent = 'Deleting...';

    fetch(`/admin-dashboard/categories/${categoryId}/delete/`, {
      method: 'DELETE',
      headers: {
        'X-CSRFToken': getCookie('csrftoken'),
        'Content-Type': 'application/json',
      },
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        location.reload();
      } else {
        if (typeof showToast === 'function') {
          showToast('error', data.message || 'Failed to delete category.');
        } else {
          alert(data.message || 'Failed to delete category.');
        }
        btn.disabled = false;
        btn.textContent = 'Delete Category';
      }
    })
    .catch(error => {
      console.error('Error:', error);
      if (typeof showToast === 'function') {
        showToast('error', 'Failed to delete category');
      } else {
        alert('Failed to delete category');
      }
      btn.disabled = false;
      btn.textContent = 'Delete Category';
    });
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  // Close modal when clicking outside
  document.getElementById('deleteCategoryModal')?.addEventListener('click', function(e) {
    if (e.target === this) {
      closeDeleteCategoryModal();
    }
  });
</script>
